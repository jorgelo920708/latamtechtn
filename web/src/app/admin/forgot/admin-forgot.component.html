@if (t()?.forgot; as t) {
  <div class="auth-wrap">
    <div class="auth-card">
      <button type="button" class="auth-lang" (click)="toggleLang()" aria-label="Language">
        <app-icon name="globe" />
        <span>{{ lang() === 'es' ? 'ES' : 'EN' }}</span>
      </button>

      <div class="auth-brand">
        <span class="auth-mark"><app-icon name="logo" /></span>
        <div class="auth-brand-text">
          <strong>LATAM</strong>
          <small>{{ t.title }}</small>
        </div>
      </div>

      @if (sent()) {
        <div class="auth-success">
          <span class="auth-success-icon"><app-icon name="mail" /></span>
          <h1>{{ t.sentTitle }}</h1>
          <p>{{ t.sentBody }}</p>
          <a routerLink="/admin/login" class="btn btn-ghost">{{ t.backToLogin }}</a>
        </div>
      } @else {
        <h1>{{ t.title }}</h1>
        <p class="auth-lead">{{ t.lead }}</p>
        <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
          <div class="field">
            <label for="af-email">{{ t.email }}</label>
            <input
              id="af-email"
              type="email"
              formControlName="email"
              placeholder="tu@email.com"
              autocomplete="username"
            />
          </div>
          <button type="submit" class="btn btn-primary btn-block" [disabled]="submitting()">
            {{ submitting() ? t.submitting : t.submit }}
          </button>
        </form>
        <div class="auth-foot">
          <a routerLink="/admin/login" class="auth-back">← {{ t.backToLogin }}</a>
        </div>
      }
    </div>
  </div>
}
