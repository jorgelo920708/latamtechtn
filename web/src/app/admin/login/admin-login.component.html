@if (t()?.login; as t) {
  <div class="auth-wrap">
    <div class="auth-card">
      <button type="button" class="auth-lang" (click)="toggleLang()" aria-label="Language">
        <app-icon name="globe" />
        <span>{{ lang() === 'es' ? 'ES' : 'EN' }}</span>
      </button>

      <div class="auth-brand">
        <span class="auth-mark"><app-icon name="logo" /></span>
        <div class="auth-brand-text">
          <strong>LATAM</strong>
          <small>{{ t.brandSub }}</small>
        </div>
      </div>

      <h1>{{ t.title }}</h1>

      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <div class="field">
          <label for="al-email">{{ t.email }}</label>
          <input
            id="al-email"
            type="email"
            formControlName="email"
            placeholder="tu@email.com"
            autocomplete="username"
          />
        </div>

        <div class="field">
          <label for="al-pass">{{ t.password }}</label>
          <input
            id="al-pass"
            type="password"
            formControlName="password"
            placeholder="••••••••"
            autocomplete="current-password"
          />
        </div>

        @if (error()) {
          <p class="form-error">{{ t.error }}</p>
        }

        <button type="submit" class="btn btn-primary btn-block" [disabled]="submitting()">
          {{ submitting() ? t.submitting : t.submit }}
        </button>
      </form>

      <div class="auth-foot">
        <a routerLink="/admin/forgot" class="auth-link">{{ t.forgot }}</a>
        <a routerLink="/" class="auth-back">{{ t.backToSite }}</a>
      </div>
    </div>
  </div>
}
